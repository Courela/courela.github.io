<html lang="pt">
	<header>
		<title>Entrar</title>
		<script
			src="https://code.jquery.com/jquery-3.7.1.min.js"
			integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
			crossorigin="anonymous">
		</script>
		<script src="js/login.js"></script>
		<script src="js/communications.js"></script>
		<script src="js/script.js"></script>
		<script src="js/settings.js"></script>
		<script src="js/auth.js"></script>
		<script src="js/menus.js"></script>
		<script src="js/meals.js"></script>
		<script src="js/modal.js"></script>
		<link rel="stylesheet" href="css/script.css" />
		<link rel="stylesheet" href="css/modal.css" />
		<script>
			$(document).ready(async function() {
				bindLogin();
				await startup();
			});
		</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	</header>
	<body class="main-app">
		<div id="credentials" class="credentials">
      		<h1 class="title">Meal Order<br><span class="subtitle">Manager</span></h1>
      		<div>
				<input id="username" placeholder="Utilizador"></input>&nbsp;
				<input id="password" placeholder="Password" type="password"></input>&nbsp;
				<button id="login">Entrar</button>
			</div>
		</div>
		<div id="spinner" class="spinner-overlay">
			<img src="images/spinner.gif" alt="Wait spinner"/>
		</div>

		<!-- The Modal -->
		<div id="appModal" class="modal">
			<!-- Modal content -->
			<div class="modal-content">
				<span class="close">&times;</span>
				<p></p>
			</div>
		</div>
	</body>
</html>
